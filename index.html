<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12212b" />
  <title>Study · Wordnote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #12212b;
      --ink-soft: #243743;
      --fog: #d7e0e6;
      --paper: #f3efe6;
      --paper-deep: #e7dfd0;
      --accent: #c45c26;
      --accent-deep: #9e4318;
      --shadow: 0 18px 40px rgba(10, 18, 24, 0.28);
      --radius: 18px;
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Manrope", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--paper);
      font-family: var(--font-body);
      background: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 90% 60% at 10% -10%, rgba(196, 92, 38, 0.22), transparent 55%),
        radial-gradient(ellipse 70% 50% at 100% 0%, rgba(80, 130, 150, 0.18), transparent 50%),
        linear-gradient(165deg, #0d1820 0%, #12212b 45%, #1a303c 100%);
    }

    .atmosphere::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      max-width: 42rem;
      margin: 0 auto;
    }

    .brand {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--paper);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .nav {
      display: flex;
      gap: 0.35rem;
    }

    .nav a {
      color: var(--fog);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
    }

    .nav a.is-active,
    .nav a:hover {
      background: rgba(243, 239, 230, 0.1);
      color: var(--paper);
    }

    .page {
      max-width: 42rem;
      margin: 0 auto;
      padding: 0.5rem 1.25rem 3rem;
    }

    .eyebrow {
      margin: 0 0 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(215, 224, 230, 0.7);
    }

    h1 {
      margin: 0 0 0.65rem;
      font-family: var(--font-display);
      font-size: clamp(2rem, 7vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .lede {
      margin: 0 0 1.25rem;
      color: rgba(215, 224, 230, 0.88);
      max-width: 36ch;
      font-size: 1.02rem;
    }

    .study-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .progress {
      margin: 0;
      font-weight: 600;
      color: var(--fog);
    }

    .empty, .error-box {
      display: none;
    }

    .empty.is-visible, .error-box.is-visible {
      display: block;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      border-radius: 14px;
      padding: 0.95rem 1.15rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
    }

    .btn:active { transform: scale(0.98); }

    .btn.primary {
      background: var(--accent);
      color: #fff8f2;
    }

    .btn.primary:hover { background: var(--accent-deep); }

    .btn.secondary {
      background: rgba(243, 239, 230, 0.14);
      color: var(--paper);
    }

    .btn.ghost {
      background: transparent;
      color: var(--fog);
      border: 1px solid rgba(243, 239, 230, 0.18);
    }

    .file-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin: 1rem 0 0;
    }

    .file-row input[type="file"] {
      display: none;
    }

    .deck {
      display: none;
      gap: 1.25rem;
    }

    .deck.is-visible {
      display: grid;
    }

    .card {
      width: 100%;
      border: none;
      padding: 0;
      background: transparent;
      perspective: 1200px;
      min-height: min(58vh, 28rem);
      cursor: pointer;
      text-align: left;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: inherit;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .card.is-flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: calc(var(--radius) + 4px);
      padding: 1.4rem 1.35rem 1.5rem;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow);
    }

    .card-face.back {
      transform: rotateY(180deg);
      background: linear-gradient(160deg, var(--paper) 0%, var(--paper-deep) 100%);
    }

    .face-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(18, 33, 43, 0.5);
    }

    .card-word {
      margin: auto 0;
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 9vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      text-align: center;
    }

    .card-meaning {
      margin: 1.2rem 0 1rem;
      font-family: var(--font-display);
      font-size: clamp(1.45rem, 5.5vw, 2rem);
      line-height: 1.25;
      font-weight: 600;
    }

    .examples {
      margin-top: auto;
      padding-top: 0.85rem;
      border-top: 1px solid rgba(18, 33, 43, 0.1);
    }

    .examples p { margin: 0; font-size: 0.98rem; }
    .examples .zh { margin-top: 0.35rem; color: var(--ink-soft); }

    .hint {
      display: block;
      text-align: center;
      margin-top: auto;
      color: rgba(18, 33, 43, 0.45);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .swipe-hint {
      margin: 0.85rem 0 0;
      text-align: center;
      color: rgba(215, 224, 230, 0.65);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .card {
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .card.is-dragging .card-inner {
      transition: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .card-inner, .btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="index.html">Wordnote</a>
    <nav class="nav">
      <a href="add.html">Add</a>
      <a href="index.html" class="is-active">Study</a>
    </nav>
  </header>

  <main class="page">
    <section class="study">
      <div class="study-meta">
        <p class="eyebrow">Review</p>
        <p id="progress" class="progress">Loading…</p>
      </div>

      <div id="empty" class="empty">
        <h1>No cards yet</h1>
        <p class="lede">Add words on the Add page, commit <code>data/words.csv</code>, then refresh.</p>
      </div>

      <div id="error-box" class="error-box">
        <h1>Couldn’t load CSV</h1>
        <p class="lede" id="error-msg">
          Browsers block reading local files via <code>file://</code>. Host this folder (e.g. GitHub Pages), or pick the CSV manually.
        </p>
        <div class="file-row">
          <label class="btn secondary" for="csv-file">Choose words.csv</label>
          <input id="csv-file" type="file" accept=".csv,text/csv" />
        </div>
      </div>

      <div id="deck" class="deck">
        <button type="button" id="card" class="card" aria-label="Flip card. Swipe for another word.">
          <div class="card-inner">
            <div class="card-face front">
              <span class="face-label">English</span>
              <p id="front-word" class="card-word"></p>
              <span class="hint">Tap to flip · Swipe for next</span>
            </div>
            <div class="card-face back">
              <span class="face-label">繁體中文</span>
              <p id="back-meaning" class="card-meaning"></p>
              <div class="examples">
                <p id="back-en"></p>
                <p id="back-zh" class="zh"></p>
              </div>
            </div>
          </div>
        </button>
        <p class="swipe-hint">Swipe left or right for a random word</p>
      </div>
    </section>
  </main>

  <script>
    const CSV_URL = "data/words.csv";
    const SWIPE_THRESHOLD = 56;

    const deck = document.getElementById("deck");
    const empty = document.getElementById("empty");
    const errorBox = document.getElementById("error-box");
    const errorMsg = document.getElementById("error-msg");
    const card = document.getElementById("card");
    const cardInner = card.querySelector(".card-inner");
    const progress = document.getElementById("progress");
    const frontWord = document.getElementById("front-word");
    const backMeaning = document.getElementById("back-meaning");
    const backEn = document.getElementById("back-en");
    const backZh = document.getElementById("back-zh");
    const csvFile = document.getElementById("csv-file");

    let words = [];
    let index = 0;
    let flipped = false;
    let seen = 1;

    const pointer = {
      active: false,
      id: null,
      startX: 0,
      startY: 0,
      dx: 0,
      dy: 0,
      swiped: false,
    };

    function shuffle(list) {
      const arr = [...list];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            cell += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            cell += ch;
          }
          continue;
        }

        if (ch === '"') {
          inQuotes = true;
        } else if (ch === ",") {
          row.push(cell);
          cell = "";
        } else if (ch === "\n" || (ch === "\r" && next === "\n")) {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
          if (ch === "\r") i++;
        } else if (ch !== "\r") {
          cell += ch;
        }
      }

      if (cell.length || row.length) {
        row.push(cell);
        rows.push(row);
      }

      if (!rows.length) return [];

      const headers = rows[0].map((h) => h.replace(/^\uFEFF/, "").trim());
      return rows.slice(1)
        .filter((r) => r.some((c) => c && c.trim()))
        .map((r) => {
          const obj = {};
          headers.forEach((h, i) => {
            obj[h] = (r[i] || "").trim();
          });
          return obj;
        })
        .filter((o) => o.word);
    }

    function setFlipped(value) {
      flipped = value;
      card.classList.toggle("is-flipped", flipped);
    }

    function showState({ hasWords, hasError, message }) {
      empty.classList.toggle("is-visible", !hasWords && !hasError);
      errorBox.classList.toggle("is-visible", !!hasError);
      deck.classList.toggle("is-visible", hasWords);
      if (message) errorMsg.textContent = message;
    }

    function render() {
      if (!words.length) {
        showState({ hasWords: false, hasError: false });
        progress.textContent = "0 cards";
        return;
      }

      showState({ hasWords: true, hasError: false });
      const w = words[index];
      frontWord.textContent = w.word || "";
      backMeaning.textContent = w.meaning_zh || "";
      backEn.textContent = w.example_en || "";
      backZh.textContent = w.example_zh || "";
      progress.textContent = `${seen} · ${words.length} cards`;
      setFlipped(false);
      cardInner.style.transform = "";
    }

    function useCsvText(text) {
      words = shuffle(parseCsv(text));
      index = 0;
      seen = words.length ? 1 : 0;
      render();
    }

    function randomWord() {
      if (!words.length) return;
      if (words.length === 1) {
        render();
        return;
      }
      let next = index;
      while (next === index) {
        next = Math.floor(Math.random() * words.length);
      }
      index = next;
      seen += 1;
      render();
    }

    function resetDragStyles() {
      card.classList.remove("is-dragging");
      cardInner.style.transform = flipped ? "rotateY(180deg)" : "";
      cardInner.style.opacity = "";
    }

    card.addEventListener("pointerdown", (event) => {
      if (event.button != null && event.button !== 0) return;
      pointer.active = true;
      pointer.id = event.pointerId;
      pointer.startX = event.clientX;
      pointer.startY = event.clientY;
      pointer.dx = 0;
      pointer.dy = 0;
      pointer.swiped = false;
      card.classList.add("is-dragging");
      try {
        card.setPointerCapture(event.pointerId);
      } catch (_) {}
    });

    card.addEventListener("pointermove", (event) => {
      if (!pointer.active || event.pointerId !== pointer.id) return;
      pointer.dx = event.clientX - pointer.startX;
      pointer.dy = event.clientY - pointer.startY;

      if (Math.abs(pointer.dx) > 8 && Math.abs(pointer.dx) > Math.abs(pointer.dy)) {
        const rot = pointer.dx * 0.04;
        cardInner.style.transform = `translateX(${pointer.dx}px) rotate(${rot}deg)`;
        cardInner.style.opacity = String(Math.max(0.45, 1 - Math.abs(pointer.dx) / 280));
      }
    });

    function endPointer(event) {
      if (!pointer.active || event.pointerId !== pointer.id) return;
      pointer.active = false;

      const absX = Math.abs(pointer.dx);
      const absY = Math.abs(pointer.dy);
      const isSwipe = absX >= SWIPE_THRESHOLD && absX > absY;

      if (isSwipe) {
        pointer.swiped = true;
        randomWord();
      } else {
        resetDragStyles();
      }

      try {
        card.releasePointerCapture(event.pointerId);
      } catch (_) {}
    }

    card.addEventListener("pointerup", endPointer);
    card.addEventListener("pointercancel", (event) => {
      if (!pointer.active || event.pointerId !== pointer.id) return;
      pointer.active = false;
      resetDragStyles();
    });

    card.addEventListener("click", (event) => {
      if (pointer.swiped) {
        pointer.swiped = false;
        event.preventDefault();
        return;
      }
      // Ignore tiny accidental moves counted as clicks after drag reset
      if (Math.abs(pointer.dx) > 12 || Math.abs(pointer.dy) > 12) {
        pointer.dx = 0;
        pointer.dy = 0;
        return;
      }
      setFlipped(!flipped);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
        event.preventDefault();
        randomWord();
      } else if (event.key === " " || event.key === "Enter") {
        event.preventDefault();
        setFlipped(!flipped);
      }
    });

    csvFile.addEventListener("change", async () => {
      const file = csvFile.files && csvFile.files[0];
      if (!file) return;
      useCsvText(await file.text());
    });

    async function init() {
      try {
        const res = await fetch(CSV_URL + "?t=" + Date.now());
        if (!res.ok) throw new Error("HTTP " + res.status);
        useCsvText(await res.text());
      } catch (err) {
        progress.textContent = "—";
        showState({
          hasWords: false,
          hasError: true,
          message:
            "Couldn’t fetch data/words.csv (" +
            (err && err.message ? err.message : "blocked") +
            "). On GitHub Pages this works automatically. For a local file open, use Choose words.csv below.",
        });
      }
    }

    init();
  </script>
</body>
</html>
